<div class="min-h-screen flex items-center justify-center bg-gray-100 p-4">
  <div class="max-w-md w-full bg-white rounded-lg shadow-md p-6">
    <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Crear Cuenta</h2>

    @if (errorMessage()) {
      <div class="mb-4 p-3 bg-red-100 border border-red-400 text-red-700 text-sm rounded">
        {{ errorMessage() }}
      </div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">Nombre</label>
        <input type="text" formControlName="name" placeholder="Tu nombre"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Correo electrónico</label>
        <input type="email" formControlName="email" placeholder="tu@correo.com"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Contraseña</label>
        <input type="password" formControlName="password" placeholder="••••••••"
          class="mt-1 block w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500" />
      </div>

      <button type="submit" [disabled]="isLoading()"
        class="w-full py-2 px-4 rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50">
        {{ isLoading() ? 'Registrando...' : 'Registrarse' }}
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
      ¿Ya tienes cuenta? <a routerLink="/login" class="text-indigo-600 hover:underline font-medium">Inicia sesión</a>
    </p>
  </div>
</div>
